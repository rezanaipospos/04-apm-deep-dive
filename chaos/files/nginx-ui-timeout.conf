server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Standardisasi timeout semua upstream: 1s (fail fast)
  proxy_connect_timeout 1s;
  proxy_read_timeout 1s;

  location /api/films {
    proxy_pass http://cinema-svc:8081;
  }
  location /api/layouts {
    proxy_pass http://layout-svc:8082;
  }
  location /api/checkout {
    proxy_pass http://checkout-svc:8083;
  }
  location /api/wallet {
    proxy_pass http://payment-svc:8084;
  }
  location /api/payments {
    proxy_pass http://payment-svc:8084;
  }
  location / {
    try_files $uri /index.html;
  }
}
